<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sunrise Run — A Dog Platformer</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      /* Override p5.js inline width/height so canvas scales to fit */
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 100% !important;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* ── Touch Controls ── */
    #touch-controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      display: none;
      z-index: 10;
      padding: 8px 24px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #touch-controls.active {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .touch-btn {
      border: none;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 22px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-modify: read-only;
    }
    .touch-btn:active {
      background: rgba(255,255,255,0.35);
    }
    .touch-dpad {
      display: flex;
      gap: 16px;
    }
    .touch-dpad .touch-btn {
      width: 80px;
      height: 80px;
      font-size: 36px;
    }
    .touch-jump {
      width: 100px;
      height: 100px;
      font-size: 44px;
      border-radius: 50%;
      background: rgba(255,200,100,0.22);
      box-shadow: 0 0 32px rgba(255,200,100,0.12);
      border: 3px solid rgba(255,200,100,0.3);
    }
    .touch-jump:active {
      background: rgba(255,200,100,0.5);
    }
    @media (min-width: 1025px) and (hover: hover) and (pointer: fine) {
      #touch-controls.active { display: none; }
    }
  </style>
</head>
<body>
<div id="game-container"></div>
<div id="touch-controls">
  <div class="touch-dpad">
    <button class="touch-btn" id="btn-left" aria-label="Left">◀</button>
    <button class="touch-btn" id="btn-right" aria-label="Right">▶</button>
  </div>
  <button class="touch-btn touch-jump" id="btn-jump" aria-label="Jump">▲</button>
</div>
<script>
// ──────────────────────────────────────────────
//  SUNRISE RUN — 2D Platformer
//  Help Sunrise collect treats and avoid squirrels!
// ──────────────────────────────────────────────

const GW = 960, GH = 540, GRAVITY = 0.6, GROUND_Y = GH - 64, TILE = 32;

let touchLeft = false, touchRight = false, isTouchDevice = false;
let state = 'title', score = 0, lives = 3, cameraX = 0, levelWidth = 0;
let player, enemies, collectibles, flag, particles = [];

const ROWS = 17, COLS = 100;
let level = [];

function buildLevel() {
  level = [];
  for (let r = 0; r < ROWS; r++) { level[r] = new Array(COLS).fill(0); }
  for (let c = 0; c < COLS; c++) { level[ROWS - 1][c] = 1; }
  for (let c = 0; c < COLS; c++) { if (random() < 0.3) level[ROWS - 2][c] = 1; }
  let platformDefs = [
    { x: 6,  y: 12, w: 5 },  { x: 14, y: 10, w: 4 }, { x: 20, y: 12, w: 6 },
    { x: 28, y: 9,  w: 5 },  { x: 35, y: 12, w: 4 }, { x: 41, y: 10, w: 6 },
    { x: 49, y: 8,  w: 4 },  { x: 54, y: 12, w: 5 }, { x: 61, y: 11, w: 5 },
    { x: 68, y: 9,  w: 4 },  { x: 74, y: 12, w: 5 }, { x: 80, y: 10, w: 4 },
    { x: 86, y: 8,  w: 4 },  { x: 92, y: 12, w: 5 },
  ];
  for (let p of platformDefs) { for (let c = p.x; c < p.x + p.w; c++) level[p.y][c] = 2; }
  let bricks = [
    { x: 15, y: 8 }, { x: 17, y: 8 }, { x: 29, y: 6 }, { x: 31, y: 6 },
    { x: 42, y: 6 }, { x: 43, y: 6 }, { x: 55, y: 8 }, { x: 57, y: 8 },
    { x: 69, y: 6 }, { x: 70, y: 6 }, { x: 81, y: 6 }, { x: 83, y: 6 },
    { x: 93, y: 8 }, { x: 94, y: 8 },
  ];
  for (let b of bricks) level[b.y][b.x] = 3;
}

class Player {
  constructor() {
    this.w = 24; this.h = 32; this.x = 100; this.y = GROUND_Y - this.h;
    this.vx = 0; this.vy = 0; this.speed = 4; this.jumpForce = -11;
    this.onGround = false; this.facing = 1; this.animFrame = 0;
    this.animTimer = 0; this.invincible = 0; this.tailWag = 0;
  }
  update() {
    this.vx = 0;
    if (keyIsDown(LEFT_ARROW) || keyIsDown(65) || touchLeft)  this.vx = -this.speed;
    if (keyIsDown(RIGHT_ARROW) || keyIsDown(68) || touchRight) this.vx = this.speed;
    if (this.vx !== 0) this.facing = this.vx > 0 ? 1 : -1;
    this.vy += GRAVITY; if (this.vy > 12) this.vy = 12;
    this.x += this.vx; this.onGround = false; this.resolveCollisionX();
    this.y += this.vy; this.resolveCollisionY();
    if (this.x < 0) this.x = 0;
    if (this.x > levelWidth - this.w) this.x = levelWidth - this.w;
    if (this.y > GH + 50) this.die();
    if (this.onGround && abs(this.vx) > 0) {
      this.animTimer++; if (this.animTimer > 6) { this.animFrame = (this.animFrame+1)%4; this.animTimer=0; }
    } else if (this.onGround) { this.animFrame=0; this.animTimer=0; }
    if (this.invincible > 0) this.invincible--;
    this.tailWag += 0.15;
  }
  jump() { if (this.onGround) { this.vy = this.jumpForce; this.onGround = false; } }
  resolveCollisionX() {
    let left=floor(this.x/TILE), right=floor((this.x+this.w-1)/TILE), top=floor(this.y/TILE), bottom=floor((this.y+this.h-1)/TILE);
    for (let r=top; r<=bottom; r++) for (let c=left; c<=right; c++)
      if (c>=0 && c<COLS && r>=0 && r<ROWS && level[r][c]>0) {
        if (this.vx>0) this.x=c*TILE-this.w; else if (this.vx<0) this.x=c*TILE+TILE; this.vx=0;
      }
  }
  resolveCollisionY() {
    let left=floor(this.x/TILE), right=floor((this.x+this.w-1)/TILE), top=floor(this.y/TILE), bottom=floor((this.y+this.h-1)/TILE);
    for (let r=top; r<=bottom; r++) for (let c=left; c<=right; c++)
      if (c>=0 && c<COLS && r>=0 && r<ROWS && level[r][c]>0) {
        if (this.vy>0) { this.y=r*TILE-this.h; this.vy=0; this.onGround=true; }
        else if (this.vy<0) { this.y=r*TILE+TILE; this.vy=0; if (level[r][c]===3) { level[r][c]=0; spawnParticles(c*TILE+TILE/2,r*TILE,8); score+=50; } }
      }
  }
  hit() { if (this.invincible>0) return; lives--; this.invincible=60; if (lives<=0) state='gameover'; else { this.x=max(100,this.x-200); this.y=0; this.vy=0; } }
  die() { lives--; if (lives<=0) state='gameover'; else { this.x=max(100,this.x-300); this.y=100; this.vy=0; } }
  draw() {
    if (this.invincible>0 && floor(this.invincible/4)%2===0) return;
    push(); translate(this.x+this.w/2,this.y+this.h);
    noStroke(); fill(0,0,0,70); ellipse(0,2,this.w*0.8,6);
    let bodyW=this.w*0.85, bodyH=this.h*0.55, bodyY=-this.h*0.18;
    let legOff=this.onGround&&abs(this.vx)>0?sin(this.animFrame*HALF_PI)*4:0;
    fill(180,120,50); rect(-bodyW/2+4,bodyY+bodyH*0.5-legOff*0.5,5,bodyH*0.45+legOff*0.5,2); rect(bodyW/2-9,bodyY+bodyH*0.5+legOff*0.5,5,bodyH*0.45-legOff*0.5,2);
    fill(200,140,60); rect(-bodyW/2+10,bodyY+bodyH*0.5+legOff*0.5,5,bodyH*0.45-legOff*0.5,2); rect(bodyW/2-3,bodyY+bodyH*0.5-legOff*0.5,5,bodyH*0.45+legOff*0.5,2);
    fill(220,160,70); noStroke(); rect(-bodyW/2,bodyY,bodyW,bodyH,8);
    fill(240,210,150); rect(-bodyW/2+3,bodyY+bodyH*0.3,bodyW-6,bodyH*0.55,5);
    push(); translate(-bodyW/2-2,bodyY+bodyH*0.25); rotate(sin(this.tailWag)*0.5+0.3);
    fill(220,160,70); ellipse(0,-8,6,14); fill(240,210,150); ellipse(0,-12,4,6); pop();
    let headY=bodyY-this.h*0.42, headW=this.w*0.7, headH=this.h*0.4;
    fill(220,160,70); ellipse(this.facing*2,headY,headW,headH);
    fill(240,210,150); ellipse(this.facing*10,headY+2,headW*0.5,headH*0.5);
    fill(30,20,20); ellipse(this.facing*13,headY,5,4);
    fill(255); ellipse(this.facing*2+4,headY-4,7,8); ellipse(this.facing*2-5,headY-4,7,8);
    fill(30,20,20); ellipse(this.facing*2+4,headY-3,3.5,4); ellipse(this.facing*2-5,headY-3,3.5,4);
    fill(255); ellipse(this.facing*2+5,headY-5,2,2); ellipse(this.facing*2-4,headY-5,2,2);
    fill(180,120,50); push(); translate(this.facing*2-8,headY-10); rotate(-0.3); ellipse(0,-6,6,14); pop();
    push(); translate(this.facing*2+8,headY-10); rotate(0.3); ellipse(0,-6,6,14); pop();
    fill(220,50,50); rect(-bodyW/2+3,bodyY-1,bodyW-6,4,2);
    fill(255,215,0); circle(this.facing*5,bodyY+7,6); fill(220,180,0); circle(this.facing*5,bodyY+8,3);
    pop();
  }
}

class Enemy {
  constructor(x,y,pr) { this.x=x;this.y=y;this.w=20;this.h=22;this.vx=1.5;this.startX=x;this.patrolRange=pr||TILE*3;this.alive=true;this.animTimer=0; }
  update() {
    this.x+=this.vx; if(this.x>this.startX+this.patrolRange)this.vx=-1.5; if(this.x<this.startX-this.patrolRange)this.vx=1.5;
    this.y+=0.3; let b=floor((this.y+this.h)/TILE),c=floor((this.x+this.w/2)/TILE);
    if(c>=0&&c<COLS&&b>=0&&b<ROWS&&level[b][c]>0)this.y=b*TILE-this.h; this.animTimer++;
  }
  draw() {
    push();translate(this.x+this.w/2,this.y+this.h/2);let dir=this.vx>0?1:-1;
    fill(139,90,43);ellipse(0,0,this.w,this.h*0.7);
    fill(160,110,55);push();translate(-dir*8,-6);rotate(-dir*0.4+sin(this.animTimer*0.1)*0.2);ellipse(0,-6,8,16);fill(180,130,70);ellipse(0,-8,5,10);pop();
    fill(139,90,43);ellipse(dir*6,-4,11,10);fill(160,110,55);triangle(dir*8,-12,dir*4,-8,dir*10,-8);
    fill(0);ellipse(dir*8,-4,3,3);fill(255);ellipse(dir*8.5,-4.5,1,1);
    if(floor(this.animTimer/30)%2===0){fill(139,90,20);ellipse(dir*12,-2,5,4);}
    pop();
  }
}

class Collectible {
  constructor(x,y,type){this.x=x;this.y=y;this.type=type;this.w=16;this.h=16;this.collected=false;this.bobOffset=0;}
  update(){this.bobOffset=sin(frameCount*0.05+this.x)*3;}
  draw(){
    if(this.collected)return;
    push();translate(this.x+this.w/2,this.y+this.h/2+this.bobOffset);
    if(this.type==='bone'){fill(240,230,210);stroke(200,180,150);strokeWeight(2);rect(-8,-3,16,6,3);circle(-8,-4,8);circle(-8,4,8);circle(8,-4,8);circle(8,4,8);noStroke();fill(255,245,230);rect(-6,-1,12,2,1);}
    else if(this.type==='ball'){fill(255,220,50);stroke(220,180,30);strokeWeight(1.5);circle(0,0,12);stroke(240,240,240);strokeWeight(1);noFill();arc(-4,-3,6,6,-HALF_PI,HALF_PI);arc(4,3,6,6,HALF_PI,PI+HALF_PI);noStroke();}
    else{fill(210,120,80);stroke(180,90,50);strokeWeight(1.5);rect(-5,-4,10,8,3);fill(255,180,200);noStroke();rect(-4,-4,8,3,2);}
    let sp=sin(frameCount*0.1+this.x*0.5)*0.5+0.5;if(sp>0.7){fill(255,255,200,sp*200);noStroke();circle(random(-6,6),random(-8,8),3);}
    pop();
  }
}

class Flag {
  constructor(x,y){this.x=x;this.y=y;this.wave=0;}
  draw(){push();translate(this.x,this.y);this.wave+=0.05;fill(150,150,150);rect(0,-64,3,64);fill(255,100,60);let wo=sin(this.wave)*3;beginShape();vertex(3,-56);vertex(35+wo,-46);vertex(3,-36);endShape(CLOSE);fill(255,255,200);textSize(14);textAlign(CENTER);text('🐕',18+wo/2,-52);fill(255,215,0);circle(1.5,-60,8);pop();}
}

function spawnParticles(x,y,count){for(let i=0;i<count;i++)particles.push({x,y,vx:random(-3,3),vy:random(-6,-2),life:30,color:random()<0.5?color(255,215,0):color(255,180,50)});}
function updateParticles(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;if(p.life<=0)particles.splice(i,1);}}
function drawParticles(){noStroke();for(let p of particles){fill(red(p.color),green(p.color),blue(p.color),p.life*8);circle(p.x,p.y,3+p.life*0.1);}}

function setupLevel(){
  buildLevel();levelWidth=COLS*TILE;player=new Player();platforms=[];enemies=[];collectibles=[];particles=[];
  let pd=[{x:6,y:12},{x:14,y:10},{x:20,y:12},{x:28,y:9},{x:35,y:12},{x:41,y:10},{x:49,y:8},{x:54,y:12},{x:61,y:11},{x:68,y:9},{x:74,y:12},{x:80,y:10},{x:86,y:8},{x:92,y:12}];
  for(let i=0;i<pd.length;i++){if(i%3===0)enemies.push(new Enemy((pd[i].x+2)*TILE,pd[i].y*TILE-24,TILE*2));}
  for(let i=0;i<8;i++)enemies.push(new Enemy(random(15,90)*TILE,GROUND_Y-24,TILE*4));
  for(let p of pd)collectibles.push(new Collectible((p.x+2)*TILE,p.y*TILE-24,random(['bone','ball','treat'])));
  for(let i=0;i<20;i++)collectibles.push(new Collectible(random(8,96)*TILE,GROUND_Y-22,random(['bone','ball','treat'])));
  for(let i=0;i<10;i++)collectibles.push(new Collectible(random(10,95)*TILE,random(4,13)*TILE,random(['bone','treat'])));
  flag=new Flag(levelWidth-120,GROUND_Y-64);score=0;lives=3;cameraX=0;state='playing';
}

function drawBackground(){
  let st=color(135,206,235),sb=color(200,230,255);
  for(let i=0;i<GH;i++){stroke(lerpColor(st,sb,i/GH));line(0,i,GW,i);}
  let p1=-cameraX*0.1;noStroke();fill(120,160,120,200);
  for(let i=0;i<6;i++){let mx=p1+i*200+100;let h=100+noise(i*3)*80;beginShape();vertex(mx-60,GH-GROUND_Y-20);vertex(mx-30,GH-GROUND_Y-20-h);vertex(mx,GH-GROUND_Y-20-h*0.6);vertex(mx+30,GH-GROUND_Y-20-h*1.1);vertex(mx+40,GH-GROUND_Y-20);endShape(CLOSE);}
  let p2=-cameraX*0.3;fill(140,190,110,180);
  for(let i=0;i<10;i++){let hx=p2+i*140+70;let hh=40+noise(i*5)*40;beginShape();vertex(hx-50,GH-GROUND_Y-20);vertex(hx-25,GH-GROUND_Y-20-hh);vertex(hx,GH-GROUND_Y-20-hh*0.7);vertex(hx+25,GH-GROUND_Y-20-hh*0.9);vertex(hx+35,GH-GROUND_Y-20);endShape(CLOSE);}
  let p3=-cameraX*0.05;fill(255,255,255,200);noStroke();for(let i=0;i<8;i++){let cx=p3+i*180+50;let cy=40+noise(i*7)*50;ellipse(cx,cy,60,25);ellipse(cx+20,cy-10,45,22);ellipse(cx-15,cy-5,40,20);}
}

function drawTiles(){
  let sc=floor(cameraX/TILE),ec=min(sc+ceil(GW/TILE)+1,COLS);
  for(let r=0;r<ROWS;r++)for(let c=sc;c<ec;c++){
    if(level[r][c]===0)continue;
    let sx=c*TILE-cameraX;if(sx<-TILE||sx>GW)continue;let ty=r*TILE;
    if(level[r][c]===1){fill(139,100,43);noStroke();rect(sx,ty,TILE,TILE);if(r<ROWS-1&&level[r+1]&&level[r+1][c]===0){fill(100,180,60);rect(sx,ty,TILE,6);fill(80,160,50);for(let g=0;g<3;g++)triangle(sx+g*10+2,ty+6,sx+g*10+6,ty-2,sx+g*10+10,ty+6);}fill(120,85,35,40);let sd=c*100+r;if(sd%7===0)rect(sx+4,ty+10,6,4,1);if(sd%11===0)rect(sx+18,ty+16,8,5,1);}
    else if(level[r][c]===2){fill(139,100,43);noStroke();rect(sx,ty,TILE,TILE);fill(100,180,60);rect(sx,ty,TILE,5);fill(0,0,0,30);rect(sx,ty-3,TILE,3);}
    else if(level[r][c]===3){fill(200,150,80);stroke(160,110,50);strokeWeight(1);rect(sx,ty,TILE,TILE);fill(180,130,60);noStroke();rect(sx,ty+TILE/2-1,TILE,2);rect(sx+TILE/2-1,ty,2,TILE/2);rect(sx,ty+TILE/2+1,TILE/2,2);rect(sx+TILE/2+1,ty+TILE/2+1,TILE/2-1,2);fill(220,170,100);rect(sx+1,ty+1,TILE-2,3);}
  }
}

function drawHUD(){fill(0,0,0,100);noStroke();rect(8,8,180,50,10);fill(255);textSize(12);textAlign(LEFT);textStyle(BOLD);text('🦴 Treats: '+score,18,32);textAlign(RIGHT);text('❤️ x '+lives,GW-18,32);let rem=collectibles.filter(c=>!c.collected).length;textAlign(CENTER);text('🎾 Left: '+rem,GW/2,32);textStyle(NORMAL);}

function drawTitleScreen(){drawBackground();drawTiles();fill(0,0,0,120);rect(0,0,GW,GH);fill(255,220,100);textAlign(CENTER);textSize(56);textStyle(BOLD);text('SUNRISE RUN',GW/2,GH/2-80);fill(255);textSize(20);textStyle(NORMAL);text('A Dog Platformer Adventure',GW/2,GH/2-38);push();translate(GW/2,GH/2+40);let tp=new Player();tp.x=-tp.w/2;tp.y=-tp.h;tp.draw();pop();fill(200,200,220);textSize(13);text('Arrow Keys / WASD to move   •   ↑ / W / Space to jump',GW/2,GH/2+108);text('Collect treats & bones   •   Avoid squirrels   •   Reach the flag!',GW/2,GH/2+126);let pulse=sin(frameCount*0.05)*0.3+0.7;fill(255,255,100,pulse*255);textSize(22);textStyle(BOLD);text('PRESS ENTER OR TAP TO START',GW/2,GH/2+168);textStyle(NORMAL);}
function drawWinScreen(){drawBackground();drawTiles();fill(0,0,0,120);rect(0,0,GW,GH);if(frameCount%5===0)spawnParticles(random(GW),random(GH/2),3);updateParticles();drawParticles();fill(255,220,100);textAlign(CENTER);textSize(48);textStyle(BOLD);text('🎉 YOU WIN! 🎉',GW/2,GH/2-40);fill(255);textSize(20);text('Sunrise collected '+score+' points of treats!',GW/2,GH/2+10);fill(200,200,220);textSize(14);text('Press ENTER or tap to play again',GW/2,GH/2+60);textStyle(NORMAL);}
function drawGameOverScreen(){fill(0,0,0,150);rect(0,0,GW,GH);fill(255,100,100);textAlign(CENTER);textSize(48);textStyle(BOLD);text('GAME OVER',GW/2,GH/2-40);fill(255);textSize(18);text('Final Score: '+score,GW/2,GH/2+5);fill(200,200,220);textSize(14);text('Press ENTER or tap to try again',GW/2,GH/2+40);textStyle(NORMAL);}

function setupTouchControls(){
  let controls=document.getElementById('touch-controls'), container=document.getElementById('game-container');
  isTouchDevice=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  function update(){let show=isTouchDevice||window.innerWidth<1025;show?controls.classList.add('active'):controls.classList.remove('active');}
  update();window.addEventListener('resize',update);
  controls.addEventListener('gesturestart',e=>e.preventDefault());controls.addEventListener('gesturechange',e=>e.preventDefault());controls.addEventListener('gestureend',e=>e.preventDefault());
  document.querySelectorAll('.touch-btn').forEach(b=>b.addEventListener('contextmenu',e=>e.preventDefault()));
  let bl=document.getElementById('btn-left');bl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();touchLeft=true;});bl.addEventListener('pointerup',e=>{e.preventDefault();touchLeft=false;});bl.addEventListener('pointerleave',()=>touchLeft=false);bl.addEventListener('pointercancel',()=>touchLeft=false);
  let br=document.getElementById('btn-right');br.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();touchRight=true;});br.addEventListener('pointerup',e=>{e.preventDefault();touchRight=false;});br.addEventListener('pointerleave',()=>touchRight=false);br.addEventListener('pointercancel',()=>touchRight=false);
  let bj=document.getElementById('btn-jump');bj.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(state==='playing'&&player)player.jump();else if(state==='title')setupLevel();else if(state==='win'||state==='gameover'){setupLevel();state='title';}});
  container.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')return;if(state==='title')setupLevel();else if(state==='win'||state==='gameover'){setupLevel();state='title';}});
}

function setup(){createCanvas(GW,GH).parent('game-container');pixelDensity(1);setupTouchControls();setupLevel();state='title';}
function windowResized(){}

function draw(){
  background(135,206,235);
  if(state==='title'){drawTitleScreen();return;}if(state==='win'){drawWinScreen();return;}if(state==='gameover'){drawGameOverScreen();return;}
  let tcx=player.x+player.w/2-GW/2;cameraX+=(tcx-cameraX)*0.1;if(cameraX<0)cameraX=0;if(cameraX>levelWidth-GW)cameraX=levelWidth-GW;
  drawBackground();drawTiles();
  for(let c of collectibles){if(c.collected)continue;c.update();c.draw();if(!c.collected&&player.x+player.w>c.x&&player.x<c.x+c.w&&player.y+player.h>c.y&&player.y<c.y+c.h){c.collected=true;score+=c.type==='treat'?30:c.type==='bone'?50:20;spawnParticles(c.x+c.w/2,c.y+c.h/2,6);}}
  for(let e of enemies){if(!e.alive)continue;e.update();e.draw();if(player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h){if(player.vy>0&&player.y+player.h-e.y<12){e.alive=false;player.vy=-7;score+=100;spawnParticles(e.x+e.w/2,e.y+e.h/2,12);}else player.hit();}}
  player.update();player.draw();
  if(player.x+player.w>flag.x-10&&player.x<flag.x+40&&player.y+player.h>flag.y-flag.y%10&&player.y<flag.y)state='win';
  flag.draw();updateParticles();drawParticles();drawHUD();
}

function keyPressed(){if(state==='title'&&(keyCode===ENTER||keyCode===32)){setupLevel();return;}if((state==='win'||state==='gameover')&&keyCode===ENTER){setupLevel();state='title';return;}if(state==='playing'&&(keyCode===UP_ARROW||keyCode===87||keyCode===32))player.jump();}
function mousePressed(){if(state==='title')setupLevel();else if(state==='win'||state==='gameover'){setupLevel();state='title';}}
</script>
